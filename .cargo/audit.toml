# Конфигурация cargo-audit (https://github.com/rustsec/rustsec/blob/main/cargo-audit/audit.toml.example).
#
# Сюда заносятся advisory, которые осознанно игнорируются: неисправимые
# (нет патча/замены) или неприменимые к сервису. Каждый ignore комментируйте
# причиной и, по возможности, ссылкой на issue для отслеживания.

[advisories]
ignore = [
    # RUSTSEC-2026-0258 — h2: неограниченный поток пустых DATA-фреймов (DoS).
    # Патч есть только в ветке 0.4 (>= 0.4.16), туда мы обновились. Вторая копия
    # h2 в дереве — 0.3.27 из `actix-http`, и для ветки 0.3 фикса нет: последний
    # релиз 0.3.27 вышел в июле 2025, а свежая actix-http 3.13.3 по-прежнему
    # требует `h2 ^0.3.27`. Заменить нечем, пока actix не переедет на h2 0.4.
    # Снять ignore при выходе actix-http с h2 0.4 (или h2 0.3.28 с патчем).
    # https://rustsec.org/advisories/RUSTSEC-2026-0258
    "RUSTSEC-2026-0258",
]
