# cargo-audit configuration (https://github.com/rustsec/rustsec/blob/main/cargo-audit/audit.toml.example).
#
# Advisories that are deliberately ignored go here: the unfixable ones (no patch
# or replacement) and the ones that do not apply to this service. Comment every
# ignore with the reason and, where possible, a link to an issue to track it.

[advisories]
ignore = [
    # "RUSTSEC-0000-0000", # the reason for ignoring it
]
