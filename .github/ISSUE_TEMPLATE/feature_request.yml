name: Proposal
description: Something is missing, or the behaviour should change
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The most useful thing you can describe is the **problem**, not just the
        implementation you have in mind: there may be a cheaper solution to it.

        Keep the boundaries of the project in mind: the service issues, verifies
        and revokes JWTs. It does not generate or store keys (that is
        `jwks-service-app`), it does not terminate TLS (that is the reverse
        proxy) and it does not manage users.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you solving
      description: What you are trying to do and what you ran into.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: >-
        An endpoint, a field in the request body, an environment variable — as
        concretely as you can. If the API contract changes, show the request and
        the response.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: >-
        The workarounds that already exist and why they did not do. An empty
        section is a common reason for a rejection: the solution may exist
        already.
    validations:
      required: false

  - type: dropdown
    id: compat
    attributes:
      label: Compatibility
      description: Whether the proposal breaks existing behaviour.
      options:
        - Backwards compatible
        - Breaks compatibility (API, token format, configuration)
        - Not sure
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to send a pull request
          required: false
