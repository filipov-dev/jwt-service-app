name: Documentation
description: An error, a gap or an unclear passage in the documentation
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        If you had to dig through the code to answer your question, that is a
        documentation bug, not your fault. File it.

  - type: input
    id: where
    attributes:
      label: Where
      description: The file and section, or a link to the line.
      placeholder: "AGENTS.md → Configuration, the JWKS_CACHE_STALE_GRACE_SECONDS row"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: >-
        It disagrees with how the service behaves, contradicts another section,
        reads ambiguously, or is missing entirely.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: What it should say
      description: The wording, if you have one. Optional.
    validations:
      required: false
