name: Bug
description: The service behaves differently from what the documentation says
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Found a vulnerability? Close this form.** A public issue exposes it to
        everyone running the image before a patch ships. Use a private advisory
        (Security → Report a vulnerability) or write to security@filipov.dev —
        see [SECURITY.md](https://github.com/filipov-dev/jwt-service-app/blob/master/SECURITY.md).

        **Do not paste secrets, private keys or live tokens into an issue.**
        Replace the values with `...`.

  - type: input
    id: version
    attributes:
      label: Service version
      description: The image tag, or `info.version` from `GET /api-docs/openapi.json`.
      placeholder: "1.17.12"
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: How it is running
      options:
        - Docker (single container)
        - Docker Compose
        - Kubernetes
        - cargo run / cargo build
        - Something else (describe below)
    validations:
      required: true

  - type: textarea
    id: what-happens
    attributes:
      label: What happens
      description: The actual behaviour — response code, body, log line.
    validations:
      required: true

  - type: textarea
    id: what-expected
    attributes:
      label: What you expected
      description: >-
        And, if you can, where the expectation came from: a line in
        README/AGENTS.md, the OpenAPI spec, an RFC.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: >-
        A `curl` invocation or a short script is clearer than prose. Keep the
        headers, replace secret values with `...`.
      render: shell
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: >-
        Environment variables **without secret values**: which access levels are
        enabled, whether `RATE_LIMIT_TRUSTED_PROXIES` is set, whether
        `AUTH_TOTP_REPLAY_PROTECTION` is on, which `TOKEN_ALGORITHM` is in use.
      render: shell
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        The lines around the error. More readable with `LOG_FORMAT=json` and
        `RUST_LOG=jwt_service_app=debug`.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked that the behaviour is the same on the latest tag (or said that I did not)
          required: false
        - label: There are no secrets or live tokens in the text
          required: true
        - label: >-
            This is not one of the decisions covered by "What is not considered
            a vulnerability" in SECURITY.md or "Conventions and pitfalls" in
            AGENTS.md
          required: false
