# Blank issues are disabled on purpose: the forms ask for exactly the things
# without which triage would start with follow-up questions anyway.
blank_issues_enabled: false
contact_links:
  - name: Report a vulnerability (privately)
    url: https://github.com/filipov-dev/jwt-service-app/security/advisories/new
    about: >-
      Do not open a public issue for a vulnerability — it exposes the finding to
      everyone running the image before a patch exists. Use a private advisory,
      or write to security@filipov.dev. The policy and the timelines are in
      SECURITY.md.
  - name: Keys, JWKS and their rotation
    url: https://github.com/filipov-dev/jwks-service-app/issues
    about: >-
      This service neither generates nor stores keys — jwks-service-app does.
      File bugs about keys in its repository.
  - name: Project documentation
    url: https://github.com/filipov-dev/jwt-service-app#documentation
    about: >-
      Environment variables, access levels, proxy configurations, client
      examples, observability and production manifests — the answer may already
      be there.
