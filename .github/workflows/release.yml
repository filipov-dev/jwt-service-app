name: Create Release

on:
  push:
    branches:
      - master
    paths:
      - Cargo.toml

# Явный блок обнуляет всё неперечисленное, поэтому здесь оба права:
# contents — создать тег и релиз, actions — дёрнуть docker.yml через
# workflow_dispatch (без него шаг с curl получит 403).
permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0 — нужна вся история и теги: описание релиза собирается по
      # коммитам от предыдущего тега, а при обычном shallow-клоне их нет.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from Cargo.toml
        run: |
          echo "VERSION=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)" >> "$GITHUB_ENV"

      - name: Build release notes
        run: |
          # Тот же скрипт, что собирает CHANGELOG.md, — разделы и формулировки
          # в описании релиза и в файле совпадают по построению.
          scripts/changelog.sh > notes.md
          cat notes.md

      # gh вместо actions/create-release@v1: тот заархивирован ещё в 2021-м и
      # тело релиза принимает только строкой, а у нас многострочный markdown.
      # gh есть на раннере из коробки и создаёт тег сам.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file notes.md \
            --target "${GITHUB_SHA}"

      - name: Trigger another workflow
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/filipov-dev/jwt-service-app/actions/workflows/docker.yml/dispatches \
            -d '{"ref":"v${{ env.VERSION }}"}'
