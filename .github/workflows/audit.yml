name: Security audit

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".cargo/audit.toml"
      - ".github/workflows/audit.yml"
  schedule:
    # Weekly, to catch new CVEs without any change in the code.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# A public repository: anyone can open a pull request, and every push to its
# branch starts a full run. A new push cancels the previous run of the same pull
# request so that a series of pushes does not hog the runner queue. Runs on
# `master` are never cancelled — the condition turns `cancel-in-progress` off.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      # persist-credentials: false — the token in `.git/config` is not needed
      # below: no step talks to git over the network (see ci.yml).
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # A vulnerable dependency blocks the pull request (non-zero exit code).
      # False positives and unfixable advisories go into .cargo/audit.toml.
      - name: Run cargo audit
        run: cargo audit
