name: Security audit

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".cargo/audit.toml"
      - ".github/workflows/audit.yml"
  schedule:
    # Еженедельно, чтобы ловить новые CVE без изменений в коде.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Публичный репозиторий: PR открывает кто угодно, и каждый пуш в его ветку
# запускает полный прогон. Новый пуш отменяет предыдущий прогон того же PR,
# чтобы серия пушей не держала очередь раннеров. Прогоны на `master` не
# отменяются никогда — там `cancel-in-progress` выключен условием.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      # persist-credentials: false — токен из `.git/config` ниже не нужен:
      # в git по сети не ходит ни один шаг (см. ci.yml).
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Уязвимость в зависимостях блокирует PR (ненулевой код возврата).
      # Ложные срабатывания и неисправимые advisory заносятся в .cargo/audit.toml.
      - name: Run cargo audit
        run: cargo audit
