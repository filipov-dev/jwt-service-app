name: CI

on:
  pull_request:
    branches:
      - master
  # Мерж-коммиты и прямые пуши в master тоже должны проверяться: без этого
  # ветка по умолчанию остаётся единственным местом, где код не проходит CI.
  push:
    branches:
      - master
  workflow_dispatch:

# Публичный репозиторий: PR открывает кто угодно, и каждый пуш в его ветку
# запускает полный прогон. Новый пуш отменяет предыдущий прогон того же PR,
# чтобы серия пушей не держала очередь раннеров. Прогоны на `master` не
# отменяются никогда — там `cancel-in-progress` выключен условием.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      # persist-credentials: false — checkout по умолчанию оставляет токен
      # в `.git/config` до конца job'ы, а следующие шаги собирают и запускают
      # код из PR, то есть чужой код с доступом к рабочему каталогу. Ни один
      # шаг ниже в git по сети не ходит, поэтому токену там делать нечего.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      # Канал совпадает с `rust-toolchain.toml` в корне (channel = "stable"),
      # поэтому cargo, который читает toolchain-файл, получает ровно тот
      # тулчейн, который поставил этот шаг. Компоненты продублированы намеренно:
      # так они ставятся сразу, а не догружаются при первом вызове clippy.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Скрипты релиза — тоже код, и ломаются они молча уже в CI. shellcheck
      # предустановлен на раннере, шаг занимает секунду.
      - name: Shellcheck
        run: shellcheck scripts/*.sh

      # Форматирование проверяется первым: шаг быстрый и не требует сборки,
      # поэтому даёт обратную связь раньше остальных.
      - name: Format
        run: cargo fmt --all -- --check

      # `-D warnings` делает предупреждения ошибками: без него шаг оставался
      # зелёным при любых замечаниях и ничего не гарантировал.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose
