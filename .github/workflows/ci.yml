name: CI

on:
  pull_request:
    branches:
      - master
  # Merge commits and direct pushes to master must be checked too: without this
  # the default branch stays the one place where code never goes through CI.
  push:
    branches:
      - master
  workflow_dispatch:

# A public repository: anyone can open a pull request, and every push to its
# branch starts a full run. A new push cancels the previous run of the same pull
# request so that a series of pushes does not hog the runner queue. Runs on
# `master` are never cancelled — the condition turns `cancel-in-progress` off.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      # persist-credentials: false — by default checkout leaves the token in
      # `.git/config` for the rest of the job, while the steps below build and
      # run the code from the pull request, that is, someone else's code with
      # access to the working directory. No step below talks to git over the
      # network, so the token has no business being there.
      #
      # fetch-depth: 0 — the changelog check regenerates the file from the tags,
      # and a shallow clone has none of them. It fetches history, not
      # credentials: the flag above still applies.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      # The channel matches `rust-toolchain.toml` in the root
      # (channel = "stable"), so cargo, which reads the toolchain file, gets
      # exactly the toolchain this step installed. The components are duplicated
      # on purpose: that way they are installed up front rather than pulled in
      # on the first clippy invocation.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Release scripts are code too, and they break silently once in CI.
      # shellcheck is preinstalled on the runner and the step takes a second.
      - name: Shellcheck
        run: shellcheck scripts/*.sh

      # The language gate: this repository is English (see AGENTS.md,
      # "Repository language"). It runs before the build for the same reason as
      # the formatting check — it is instant and needs no toolchain.
      - name: Language
        run: scripts/check-language.sh

      # CHANGELOG.md is generated from the history, so it can go stale without
      # anyone touching it — a new tag alone is enough. This is the same guard
      # `spec_file_is_up_to_date` gives docs/openapi.json: a generated file that
      # nothing compares against drifts from its generator and keeps looking
      # authoritative while it does.
      #
      # Pull requests only, and not because master matters less. The push that
      # merges a version bump is the push that starts `release.yml`, so master
      # and the new tag appear at the same moment and the file is legitimately
      # one release behind itself for as long as it takes the next pull request
      # to rebuild it. Checking master here would fail on that gap every single
      # release. The gate belongs on the way in, which is where the fix is
      # cheap.
      - name: Changelog
        if: github.event_name == 'pull_request'
        run: scripts/changelog.sh --check

      # Formatting is checked first: the step is fast and needs no build, so it
      # gives feedback before the others.
      - name: Format
        run: cargo fmt --all -- --check

      # `-D warnings` turns warnings into errors: without it the step stayed
      # green whatever the linter said and guaranteed nothing.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose
