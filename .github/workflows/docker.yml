name: Build and Push Docker Image

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
  release:
    types: [published]

# Every platform is built natively (no QEMU): amd64 on an ordinary runner and
# arm64 on a GitHub ARM runner. QEMU emulation produced a cc/collect2 segfault
# while linking openssl-* for aarch64 (JWT-5).
env:
  DOCKERHUB_IMAGE: filipov/jwt-service-app
  GHCR_IMAGE: ghcr.io/filipov-dev/jwt-service-app

permissions:
  contents: read
  packages: write

jobs:
  # Step 1: build the image for each platform on its native runner and push it
  # to both registries by digest (without tags).
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      # persist-credentials: false — the token in `.git/config` is not needed
      # below: no step talks to git over the network (see ci.yml).
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          file: ./deployments/prod/Dockerfile
          context: .
          # No attestations: otherwise every image is wrapped in a manifest
          # list whose digest differs between registries, and imagetools cannot
          # find it by a shared digest when assembling the multi-arch manifest
          # (JWT-5).
          provenance: false
          sbom: false
          # Layer cache between CI runs through the GitHub Actions cache. The
          # dependency layer (cargo chef cook) is reused as long as
          # Cargo.toml/Cargo.lock are unchanged — a rebuild does not compile the
          # crates again. The scope is split per platform: amd64 and arm64 must
          # not overwrite each other's cache. mode=max caches the intermediate
          # build layers too.
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=${{ env.PLATFORM_PAIR }},mode=max
          outputs: |
            type=image,name=${{ env.DOCKERHUB_IMAGE }},push-by-digest=true,name-canonical=true,push=true
            type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Step 2: assemble a multi-arch manifest from the images pushed by digest and
  # set the tags (the version from Cargo.toml plus latest) in both registries.
  merge:
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from Cargo.toml
        id: version
        run: |
          echo "VERSION=$(grep -m1 'version' Cargo.toml | cut -d '"' -f 2)" >> "$GITHUB_ENV"

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          for image in "$DOCKERHUB_IMAGE" "$GHCR_IMAGE"; do
            docker buildx imagetools create \
              -t "${image}:${VERSION}" \
              -t "${image}:latest" \
              $(printf "${image}@sha256:%s " *)
          done

      - name: Inspect
        run: |
          docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:${VERSION}"
          docker buildx imagetools inspect "${GHCR_IMAGE}:${VERSION}"

      - name: Docker Hub Description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
          repository: filipov/jwt-service-app
          readme-filepath: ./deployments/prod/README.md
