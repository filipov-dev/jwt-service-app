name: Build and Push Docker Image

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
  release:
    types: [published]

# Собираем каждую платформу нативно (без QEMU): amd64 на обычном раннере,
# arm64 — на ARM-раннере GitHub. Эмуляция QEMU давала segfault cc/collect2
# при линковке openssl-* под aarch64 (JWT-5).
env:
  DOCKERHUB_IMAGE: filipov/jwt-service-app
  GHCR_IMAGE: ghcr.io/filipov-dev/jwt-service-app

permissions:
  contents: read
  packages: write

jobs:
  # Шаг 1: собрать образ под каждую платформу на её нативном раннере и
  # запушить его в оба реестра по digest (без тегов).
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          file: ./deployments/prod/Dockerfile
          context: .
          # Без аттестаций: иначе каждый образ заворачивается в manifest list,
          # digest которого отличается между реестрами, и imagetools не находит
          # его по общему digest при сборке multi-arch манифеста (JWT-5).
          provenance: false
          sbom: false
          # Кеш слоёв между запусками CI через GitHub Actions cache. Слой с
          # зависимостями (cargo chef cook) переиспользуется, пока не менялись
          # Cargo.toml/Cargo.lock — повторная сборка не компилирует крейты заново.
          # Scope разделён по платформам: amd64 и arm64 не должны затирать кеш
          # друг друга. mode=max кеширует и промежуточные слои сборки.
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=${{ env.PLATFORM_PAIR }},mode=max
          outputs: |
            type=image,name=${{ env.DOCKERHUB_IMAGE }},push-by-digest=true,name-canonical=true,push=true
            type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Шаг 2: собрать из пуш-нутых по digest образов multi-arch манифест и
  # проставить теги (версия из Cargo.toml + latest) в обоих реестрах.
  merge:
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - uses: actions/checkout@v7

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from Cargo.toml
        id: version
        run: |
          echo "VERSION=$(grep -m1 'version' Cargo.toml | cut -d '"' -f 2)" >> "$GITHUB_ENV"

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          for image in "$DOCKERHUB_IMAGE" "$GHCR_IMAGE"; do
            docker buildx imagetools create \
              -t "${image}:${VERSION}" \
              -t "${image}:latest" \
              $(printf "${image}@sha256:%s " *)
          done

      - name: Inspect
        run: |
          docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:${VERSION}"
          docker buildx imagetools inspect "${GHCR_IMAGE}:${VERSION}"

      - name: Docker Hub Description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
          repository: filipov/jwt-service-app
          readme-filepath: ./deployments/prod/README.md
