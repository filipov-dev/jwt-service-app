name: Secret scan

on:
  pull_request:
    branches:
      - master
  # Мерж-коммиты и прямые пуши в master тоже проверяются: ветка по умолчанию —
  # ровно то, что читают снаружи, и оставлять её без проверки бессмысленно.
  push:
    branches:
      - master
  # Еженедельно: сигнатуры сканеров пополняются, и вчерашняя «чистая» история
  # сегодня может оказаться нечистой без единого нового коммита.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0 обязателен. По умолчанию checkout берёт один коммит,
      # и сканеры прошли бы по нему одному — то есть проверяли бы рабочее
      # дерево, а не историю, ради которой всё и затевалось.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Скрипт тот же, что запускают локально: набор флагов и allowlist'ы
      # не расходятся между CI и разработчиком по построению. docker и jq
      # на ubuntu-latest предустановлены.
      - name: Scan history for secrets
        run: scripts/scan-secrets.sh --reports reports

      # Отчёты нужны только когда что-то нашлось: по ним разбирают находку,
      # не переспрашивая у лога.
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-reports
          path: reports/
          retention-days: 14
