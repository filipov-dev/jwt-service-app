name: Secret scan

on:
  pull_request:
    branches:
      - master
  # Merge commits and direct pushes to master are checked too: the default
  # branch is exactly what people read from the outside, and leaving it
  # unchecked makes no sense.
  push:
    branches:
      - master
  # Weekly: the scanners keep adding signatures, and a history that was clean
  # yesterday can turn out dirty today without a single new commit.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# A public repository: anyone can open a pull request, and every push to its
# branch starts a full run. A new push cancels the previous run of the same pull
# request so that a series of pushes does not hog the runner queue. Runs on
# `master` are never cancelled — the condition turns `cancel-in-progress` off.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0 is mandatory. By default checkout takes a single commit
      # and the scanners would walk that one alone — that is, they would check
      # the working tree rather than the history this exists for.
      # persist-credentials: false — the token in `.git/config` is not needed
      # below: no step talks to git over the network (see ci.yml).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The same script developers run locally: the flag set and the allowlists
      # cannot drift between CI and a developer by construction. docker and jq
      # are preinstalled on ubuntu-latest.
      - name: Scan history for secrets
        run: scripts/scan-secrets.sh --reports reports

      # The reports are only needed when something was found: they are what a
      # finding is investigated from, without going back to the log.
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: secret-scan-reports
          path: reports/
          retention-days: 14
