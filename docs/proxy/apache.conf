# Apache httpd (mod_proxy + mod_headers). The secret comes from the environment
# through ${PROXY_SECRET} (an httpd environment variable declared with
# PassEnv/SetEnv or in envvars). RequestHeader set overwrites the client-supplied
# version; unset is there for explicitness.

<VirtualHost *:443>
    ServerName api.example.com

    # (1) Delete the client-supplied version of the header.
    RequestHeader unset X-Proxy-Secret
    # (2) Set the secret from the environment. early means before proxying.
    RequestHeader set X-Proxy-Secret "${PROXY_SECRET}" early

    ProxyPass        / http://jwt_service:8080/
    ProxyPassReverse / http://jwt_service:8080/
</VirtualHost>
