# Apache httpd (mod_proxy + mod_headers). Секрет из env через ${PROXY_SECRET}
# (переменная окружения httpd, объявленная PassEnv/SetEnv или в envvars).
# RequestHeader set перезаписывает клиентскую версию; unset для явности.

<VirtualHost *:443>
    ServerName api.example.com

    # (1) Удаляем клиентскую версию заголовка.
    RequestHeader unset X-Proxy-Secret
    # (2) Ставим секрет из окружения. early — до проксирования.
    RequestHeader set X-Proxy-Secret "${PROXY_SECRET}" early

    ProxyPass        / http://jwt_service:8080/
    ProxyPassReverse / http://jwt_service:8080/
</VirtualHost>
