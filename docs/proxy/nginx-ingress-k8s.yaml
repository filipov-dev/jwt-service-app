# NGINX Ingress Controller (Kubernetes). A secret is NOT mounted from a
# Kubernetes Secret into a controller environment variable directly —
# configuration-snippet does not read the pod's env. The practice: render the
# snippet from the Secret through a template (Helm/Kustomize), or use the safer
# auth-snippet. Below: configuration-snippet.
#
# IMPORTANT: snippets must be allowed (allow-snippet-annotations: "true").

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jwt-service
  annotations:
    nginx.ingress.kubernetes.io/configuration-snippet: |
      # (1) Strip the client-supplied version of the header.
      proxy_set_header X-Proxy-Secret "";
      # (2) Set the secret. The value is substituted when the manifest is
      # rendered, from a Kubernetes Secret (Helm: {{ .Values.proxySecret }} /
      # Kustomize secretGenerator).
      proxy_set_header X-Proxy-Secret "REPLACE_WITH_SECRET_AT_RENDER";
spec:
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jwt-service
                port:
                  number: 8080
