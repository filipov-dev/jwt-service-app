# Traefik (dynamic config, file provider). The secret comes from the environment
# through templating (Traefik does not expand env inside middleware values
# itself; generate the file from a template, or use a label substituted at deploy
# time).
#
# customRequestHeaders both SETS the header and thereby OVERWRITES any
# client-supplied version — Traefik replaces the value entirely.

http:
  middlewares:
    inject-proxy-secret:
      headers:
        customRequestHeaders:
          # Overwrites the client-supplied X-Proxy-Secret with the secret value.
          X-Proxy-Secret: "{{ env "PROXY_SECRET" }}"

  routers:
    jwt:
      rule: "Host(`api.example.com`)"
      middlewares:
        - inject-proxy-secret
      service: jwt-service

  services:
    jwt-service:
      loadBalancer:
        servers:
          - url: "http://jwt_service:8080"
