# Envoy — секрет через inline env в конфиге не поддерживается напрямую;
# используйте подстановку при генерации конфига или Lua/ext_proc для чтения из
# секрет-хранилища. Ниже — request_headers_to_add (перезапись) + remove.

static_resources:
  listeners:
  - address: { socket_address: { address: 0.0.0.0, port_value: 443 } }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress
          route_config:
            virtual_hosts:
            - name: api
              domains: ["api.example.com"]
              routes:
              - match: { prefix: "/" }
                route: { cluster: jwt_service }
                request_headers_to_add:
                - header: { key: "X-Proxy-Secret", value: "${PROXY_SECRET}" }
                  # append_action REPLACE — перезаписывает клиентскую версию.
                  append_action: OVERWRITE_IF_EXISTS_OR_ADD
                # (1) Дополнительно удаляем входящий заголовок до маршрутизации.
                request_headers_to_remove: ["X-Proxy-Secret"]
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: jwt_service
    load_assignment:
      cluster_name: jwt_service
      endpoints:
      - lb_endpoints:
        - endpoint: { address: { socket_address: { address: jwt_service, port_value: 8080 } } }
