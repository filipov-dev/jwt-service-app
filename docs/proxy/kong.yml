# Kong (declarative config). The request-transformer plugin:
#   - remove.headers deletes the client-supplied version;
#   - add.headers (when absent) / replace.headers applies the secret.
# The secret value is substituted when the config is rendered, from the
# KONG_PROXY_SECRET env var (Kong does not expand env inside plugin values
# itself).

_format_version: "3.0"
services:
  - name: jwt-service
    url: http://jwt_service:8080
    routes:
      - name: jwt-route
        hosts: ["api.example.com"]
    plugins:
      - name: request-transformer
        config:
          # (1) Delete the incoming header from the client.
          remove:
            headers: ["X-Proxy-Secret"]
          # (2) Set the secret (replace guarantees an overwrite).
          replace:
            headers: ["X-Proxy-Secret:${PROXY_SECRET}"]
          add:
            headers: ["X-Proxy-Secret:${PROXY_SECRET}"]
