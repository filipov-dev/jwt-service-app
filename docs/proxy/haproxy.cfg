# HAProxy — секрет из окружения через "\"$PROXY_SECRET\"" (HAProxy разворачивает
# переменные окружения в конфиге). Порядок важен: сперва удаляем, потом ставим.

frontend fe_api
    bind :443 ssl crt /etc/haproxy/certs/api.pem
    # (1) Удаляем клиентскую версию заголовка.
    http-request del-header X-Proxy-Secret
    # (2) Ставим секрет из окружения.
    http-request set-header X-Proxy-Secret "${PROXY_SECRET}"
    default_backend be_jwt

backend be_jwt
    server jwt jwt_service:8080
