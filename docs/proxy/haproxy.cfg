# HAProxy — the secret comes from the environment through "\"$PROXY_SECRET\""
# (HAProxy expands environment variables in the config). The order matters:
# delete first, then set.

frontend fe_api
    bind :443 ssl crt /etc/haproxy/certs/api.pem
    # (1) Delete the client-supplied version of the header.
    http-request del-header X-Proxy-Secret
    # (2) Set the secret from the environment.
    http-request set-header X-Proxy-Secret "${PROXY_SECRET}"
    default_backend be_jwt

backend be_jwt
    server jwt jwt_service:8080
