# nginx — секрет из переменной окружения через envsubst или set из map.
# Здесь секрет прокидывается из env NGINX_PROXY_SECRET на этапе шаблонизации
# (например, официальный образ nginx с /etc/nginx/templates/*.conf.template).
#
# ${PROXY_SECRET} подставляется envsubst из окружения контейнера.

server {
    listen 443 ssl;
    server_name api.example.com;

    location / {
        # (1) Затираем ЛЮБУЮ клиентскую версию заголовка.
        proxy_set_header X-Proxy-Secret "";
        # (2) Ставим наш секрет из окружения (envsubst -> ${PROXY_SECRET}).
        proxy_set_header X-Proxy-Secret "${PROXY_SECRET}";

        proxy_pass http://jwt_service:8080;
    }
}
