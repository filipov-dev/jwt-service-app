# nginx — the secret comes from an environment variable through envsubst or a set
# from a map. Here the secret is injected from the NGINX_PROXY_SECRET env var at
# templating time (for example, the official nginx image with
# /etc/nginx/templates/*.conf.template).
#
# ${PROXY_SECRET} is substituted by envsubst from the container environment.

server {
    listen 443 ssl;
    server_name api.example.com;

    location / {
        # (1) Strip ANY client-supplied version of the header.
        proxy_set_header X-Proxy-Secret "";
        # (2) Set our secret from the environment (envsubst -> ${PROXY_SECRET}).
        proxy_set_header X-Proxy-Secret "${PROXY_SECRET}";

        proxy_pass http://jwt_service:8080;
    }
}
