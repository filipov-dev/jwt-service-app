[package]
name = "jwt-service-app"
version = "1.17.8"
edition = "2021"

[dependencies]
# `http2` из дефолтных фич намеренно выключен: он тянет `h2` 0.3, которая не
# получила патча к RUSTSEC-2026-0258 (ветка 0.3 не выходит с июля 2025), а сам
# HTTP/2 в сервисе не используется — TLS терминирует обратный прокси и ходит к
# апстриму по HTTP/1.x. Планируемый gRPC (JWT-102) это не задевает: `tonic`
# поднимает собственный сервер на `hyper` с `h2` 0.4. Остальные дефолтные фичи
# перечислены как есть — без `macros` не соберутся атрибуты `#[post]`.
actix-web = { version = "4.9", default-features = false, features = [
    "macros",
    "compress-brotli",
    "compress-gzip",
    "compress-zstd",
    "cookies",
    "unicode",
    "compat",
] }
actix-cors = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# TLS-бэкенд задан явно, чтобы в бинарь не линковались два стека сразу. Дефолт
# `reqwest` 0.13 — это `default-tls`, который означает уже не `native-tls`, а
# `rustls` (+ `aws-lc-rs`, `webpki`, `rustls-platform-verifier`); при этом
# `sentry` через свою фичу `transport` тянет `native-tls`, то есть openssl,
# который у нас и так обязателен для подписи JWT. Оставляем `native-tls`: он
# переиспользует уже слинкованный openssl и системные корневые сертификаты
# (`ca-certificates` в рантайм-образе), а весь rustls-стек уходит.
# Дефолтные фичи перечислены явно, кроме `system-proxy`: та читает системные
# настройки прокси Windows/macOS, а в контейнере прокси задаётся переменными
# `HTTP(S)_PROXY` — их разбирает `hyper-util/client-proxy`, он включён всегда.
# При обновлении `reqwest` список надо сверять с новым дефолтом.
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "http2",
    "charset",
    "native-tls",
] }
# `connection-manager` — постоянное мультиплексированное соединение с
# автоматическим переподключением. Без него каждая команда открывала своё TCP-
# соединение и под нагрузкой упиралась в исчерпание эфемерных портов.
redis = { version = "1.2.4", features = ["tokio-comp", "connection-manager"] }
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
utoipa = { version = "5.3.1", features = ["actix_extras", "chrono"] }
thiserror = "2.0.11"
parking_lot = "0.12"
# Только асинхронный примитив синхронизации: замок на обновление кеша JWKS
# удерживается через `await` (см. `jwk.rs`), где `parking_lot` использовать
# нельзя. Рантайм тянет actix-web, отдельно он здесь не нужен.
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "ansi"] }
openssl = "0.10.70"
base64 = "0.22.1"
# Token-bucket rate limiting (алгоритм GCRA). Берём только core-crate `governor`
# (MIT); actix-обёртку (`actix-governor`, GPL-3.0) не тянем из-за копилефта на
# публично раздаваемые Docker-образы — middleware реализован свой (см. `rate_limit.rs`).
governor = "0.10"
# Метрики: фасад `metrics` + Prometheus-рендерер. Лицензии permissive (MIT /
# MIT+Apache-2.0). `default-features = false` — дефолт тянет собственный
# HTTP-listener и push-gateway (hyper/rustls), а мы отдаём текст экспозиции
# через actix на `/metrics` (см. `metrics.rs`).
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
# Распределённый трейсинг: OTLP-экспорт в OpenTelemetry Collector (через него
# трейсы забирает Monium). Лицензии permissive (Apache-2.0 / MIT). Включается
# только при заданном OTEL_EXPORTER_OTLP_ENDPOINT — см. `tracing.rs`.
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
# Транспорт OTLP — HTTP/protobuf (порт 4318 у коллектора), а не gRPC: `reqwest`
# уже есть в зависимостях, поэтому весь tonic/gRPC-стек не тянем.
# Клиент — БЛОКИРУЮЩИЙ намеренно: batch-процессор экспортирует span'ы на своём
# выделенном потоке, где нет tokio-рантайма, и асинхронный клиент там паникует
# («there is no reactor running»). Основной async-рантайм сервиса это не задевает.
# `internal-logs` — чтобы ошибки самого экспортёра были видны в логе.
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "trace",
    "logs",
    "http-proto",
    "reqwest-blocking-client",
    "internal-logs",
] }
# Мост `tracing` → OTLP-логи (сигнал logs). Включается отдельным флагом, чтобы не
# дублировать stdout-логи там, где их уже собирают агентом.
opentelemetry-appender-tracing = "0.32"
opentelemetry-semantic-conventions = "0.32"
tracing-opentelemetry = "0.33"
# GlitchTip (Sentry-совместимый): ошибки/паники, performance-транзакции и
# структурные логи. Лицензия MIT. Все три канала включаются по DSN — см.
# `sentry_glitchtip.rs`. Фичи: `tracing` — мост из `tracing`-шины (события → issues,
# span-ы → транзакции), `logs` — структурные логи.
sentry = { version = "0.48", features = ["tracing", "logs"] }

[dev-dependencies]
# HTTP-мок сервиса ключей (`jwks-service-app`) для интеграционных тестов
# HTTP-слоя — эндпоинты выпуска/проверки токенов ходят к JWKS по сети.
wiremock = "0.6"

# Профиль релизной сборки. До этого секции не было вообще, то есть прод-образ
# собирался дефолтом cargo: LTO выключен, `codegen-units = 16`, таблица символов
# на месте.
#
# `lto = "fat"` — межкрейтовая оптимизация по всему графу зависимостей сразу.
# Крейтов здесь много и они тонкие (actix + tower-подобные слои, `tracing`,
# три клиента наблюдаемости), поэтому инлайнить есть что; `"thin"` дешевле по
# времени сборки, но образ пересобирается в CI, а не на каждом `cargo run`.
#
# `codegen-units = 1` — один codegen-юнит на крейт вместо шестнадцати: без
# разбиения оптимизатор видит модуль целиком. Параллелизм сборки при этом
# теряется, и это главный вклад в подорожавшую сборку.
#
# `strip = "symbols"` — из бинаря убирается таблица символов (debuginfo в
# релизе и так нет).
#
# ВАЖНО: `panic = "abort"` здесь намеренно НЕ задан. Он бы (1) убил канал паник
# в GlitchTip — `sentry-panic` ловит панику хуком и успевает отправить событие
# только пока стек разматывается, (2) снял изоляцию воркеров actix: паника в
# одном запросе роняла бы весь процесс вместо одного соединения. Экономия
# несопоставима.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
