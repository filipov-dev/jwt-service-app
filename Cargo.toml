[package]
name = "jwt-service-app"
version = "1.11.3"
edition = "2021"

[dependencies]
actix-web = "4.9"
actix-cors = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12.12", features = ["json"] }
# `connection-manager` — постоянное мультиплексированное соединение с
# автоматическим переподключением. Без него каждая команда открывала своё TCP-
# соединение и под нагрузкой упиралась в исчерпание эфемерных портов.
redis = { version = "0.29.0", features = ["tokio-comp", "connection-manager"] }
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
utoipa = { version = "5.3.1", features = ["actix_extras", "chrono"] }
thiserror = "2.0.11"
parking_lot = "0.12"
# Только асинхронный примитив синхронизации: замок на обновление кеша JWKS
# удерживается через `await` (см. `jwk.rs`), где `parking_lot` использовать
# нельзя. Рантайм тянет actix-web, отдельно он здесь не нужен.
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "ansi"] }
openssl = "0.10.70"
base64 = "0.22.1"
# Token-bucket rate limiting (алгоритм GCRA). Берём только core-crate `governor`
# (MIT); actix-обёртку (`actix-governor`, GPL-3.0) не тянем из-за копилефта на
# публично раздаваемые Docker-образы — middleware реализован свой (см. `rate_limit.rs`).
governor = "0.10"
# Метрики: фасад `metrics` + Prometheus-рендерер. Лицензии permissive (MIT /
# MIT+Apache-2.0). `default-features = false` — дефолт тянет собственный
# HTTP-listener и push-gateway (hyper/rustls), а мы отдаём текст экспозиции
# через actix на `/metrics` (см. `metrics.rs`).
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
# Распределённый трейсинг: OTLP-экспорт в OpenTelemetry Collector (через него
# трейсы забирает Monium). Лицензии permissive (Apache-2.0 / MIT). Включается
# только при заданном OTEL_EXPORTER_OTLP_ENDPOINT — см. `tracing.rs`.
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
# Транспорт OTLP — HTTP/protobuf (порт 4318 у коллектора), а не gRPC: `reqwest`
# уже есть в зависимостях, поэтому весь tonic/gRPC-стек не тянем.
# Клиент — БЛОКИРУЮЩИЙ намеренно: batch-процессор экспортирует span'ы на своём
# выделенном потоке, где нет tokio-рантайма, и асинхронный клиент там паникует
# («there is no reactor running»). Основной async-рантайм сервиса это не задевает.
# `internal-logs` — чтобы ошибки самого экспортёра были видны в логе.
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "trace",
    "logs",
    "http-proto",
    "reqwest-blocking-client",
    "internal-logs",
] }
# Мост `tracing` → OTLP-логи (сигнал logs). Включается отдельным флагом, чтобы не
# дублировать stdout-логи там, где их уже собирают агентом.
opentelemetry-appender-tracing = "0.32"
opentelemetry-semantic-conventions = "0.32"
tracing-opentelemetry = "0.33"
# GlitchTip (Sentry-совместимый): ошибки/паники, performance-транзакции и
# структурные логи. Лицензия MIT. Все три канала включаются по DSN — см.
# `sentry_glitchtip.rs`. Фичи: `tracing` — мост из `tracing`-шины (события → issues,
# span-ы → транзакции), `logs` — структурные логи.
sentry = { version = "0.48", features = ["tracing", "logs"] }

[dev-dependencies]
# HTTP-мок сервиса ключей (`jwks-service-app`) для интеграционных тестов
# HTTP-слоя — эндпоинты выпуска/проверки токенов ходят к JWKS по сети.
wiremock = "0.6"
