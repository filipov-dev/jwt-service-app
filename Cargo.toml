[package]
name = "jwt-service-app"
version = "1.17.18"
edition = "2021"
# Apache-2.0 rather than MIT: Apache has an explicit patent grant (section 3),
# and for a cryptographic service that matters more than the brevity of MIT. The
# full text is in `LICENSE` in the repository root. Without this field a public
# repository and the published images formally stayed "all rights reserved": the
# code could be neither forked nor used. `utoipa` also takes the string from
# here for `info.license` of the OpenAPI spec, so after editing the field the
# spec has to be regenerated (`UPDATE_OPENAPI=1 cargo test openapi`).
license = "Apache-2.0"

[dependencies]
# `http2` is deliberately excluded from the default features: it pulls in `h2`
# 0.3, which never got a patch for RUSTSEC-2026-0258 (the 0.3 branch has had no
# release since July 2025), and HTTP/2 is not used by the service anyway — the
# reverse proxy terminates TLS and talks to the upstream over HTTP/1.x. The
# planned gRPC work (JWT-102) is unaffected: `tonic` brings its own server on
# `hyper` with `h2` 0.4. The remaining default features are listed as they are —
# without `macros` the `#[post]` attributes do not compile.
actix-web = { version = "4.9", default-features = false, features = [
    "macros",
    "compress-brotli",
    "compress-gzip",
    "compress-zstd",
    "cookies",
    "unicode",
    "compat",
] }
actix-cors = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The TLS backend is set explicitly so that two stacks are not linked into the
# binary at once. The default of `reqwest` 0.13 is `default-tls`, which no longer
# means `native-tls` but `rustls` (+ `aws-lc-rs`, `webpki`,
# `rustls-platform-verifier`); meanwhile `sentry`, through its `transport`
# feature, pulls in `native-tls`, that is openssl, which we need anyway for
# signing JWTs. We keep `native-tls`: it reuses the already linked openssl and
# the system trust roots (`ca-certificates` in the runtime image), and the whole
# rustls stack goes away.
# The default features are listed explicitly except `system-proxy`: that one
# reads the Windows/macOS system proxy settings, while in a container the proxy
# comes from the `HTTP(S)_PROXY` variables — parsed by
# `hyper-util/client-proxy`, which is always enabled.
# When upgrading `reqwest`, the list has to be checked against the new default.
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "http2",
    "charset",
    "native-tls",
] }
# `connection-manager` gives a permanent multiplexed connection with automatic
# reconnection. Without it every command opened its own TCP connection and under
# load ran into ephemeral port exhaustion.
redis = { version = "1.2.4", features = ["tokio-comp", "connection-manager"] }
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
utoipa = { version = "5.3.1", features = ["actix_extras", "chrono"] }
thiserror = "2.0.11"
parking_lot = "0.12"
# Only the async synchronisation primitive: the JWKS cache refresh lock is held
# across an `await` (see `jwk.rs`), where `parking_lot` cannot be used. The
# runtime comes from actix-web and is not needed separately here.
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "ansi"] }
openssl = "0.10.70"
base64 = "0.22.1"
# Token bucket rate limiting (the GCRA algorithm). We take only the core crate
# `governor` (MIT); the actix wrapper (`actix-governor`, GPL-3.0) is kept out
# because of its copyleft on publicly distributed Docker images — the middleware
# is our own (see `rate_limit.rs`).
governor = "0.10"
# Metrics: the `metrics` facade plus the Prometheus renderer. Permissive
# licenses (MIT / MIT+Apache-2.0). `default-features = false` because the default
# pulls in its own HTTP listener and push gateway (hyper/rustls), while we serve
# the exposition text through actix on `/metrics` (see `metrics.rs`).
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
# Distributed tracing: OTLP export to an OpenTelemetry Collector (Monium picks
# the traces up through it). Permissive licenses (Apache-2.0 / MIT). Enabled only
# when OTEL_EXPORTER_OTLP_ENDPOINT is set — see `tracing.rs`.
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
# The OTLP transport is HTTP/protobuf (port 4318 on the collector) rather than
# gRPC: `reqwest` is already among the dependencies, so the whole tonic/gRPC
# stack is kept out.
# The client is BLOCKING on purpose: the batch processor exports spans on its own
# dedicated thread, where there is no tokio runtime, and an async client panics
# there ("there is no reactor running"). The service's main async runtime is
# unaffected.
# `internal-logs` makes the exporter's own errors visible in the log.
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "trace",
    "logs",
    "http-proto",
    "reqwest-blocking-client",
    "internal-logs",
] }
# The `tracing` → OTLP logs bridge (the logs signal). It is enabled by a separate
# flag so as not to duplicate stdout logs where an agent already collects them.
opentelemetry-appender-tracing = "0.32"
opentelemetry-semantic-conventions = "0.32"
tracing-opentelemetry = "0.33"
# GlitchTip (Sentry-compatible): errors and panics, performance transactions and
# structured logs. MIT license. All three channels are enabled by the DSN — see
# `sentry_glitchtip.rs`. The features: `tracing` is the bridge from the `tracing`
# bus (events → issues, spans → transactions) and `logs` is structured logs. The
# Logs channel itself is enabled by our event filter rather than by
# `ClientOptions::enable_logs`: since 0.49 that field is deprecated and only
# affects automatic capture by integrations.
sentry = { version = "0.49", features = ["tracing", "logs"] }

[dev-dependencies]
# An HTTP mock of the key service (`jwks-service-app`) for the integration tests
# of the HTTP layer — the issue and verify endpoints talk to the JWKS over the
# network.
wiremock = "0.6"

# The release build profile. There was no such section at all before, so the
# production image was built with the cargo defaults: LTO off,
# `codegen-units = 16`, the symbol table intact.
#
# `lto = "fat"` is cross-crate optimisation over the whole dependency graph at
# once. There are many crates here and they are thin (actix plus tower-like
# layers, `tracing`, three observability clients), so there is plenty to inline;
# `"thin"` is cheaper in build time, but the image is rebuilt in CI rather than
# on every `cargo run`.
#
# `codegen-units = 1` means one codegen unit per crate instead of sixteen:
# without the split the optimiser sees the whole module. Build parallelism is
# lost in the process, and that is the main contributor to the more expensive
# build.
#
# `strip = "symbols"` removes the symbol table from the binary (there is no
# debuginfo in a release build anyway).
#
# IMPORTANT: `panic = "abort"` is deliberately NOT set here. It would (1) kill
# the panic channel into GlitchTip — `sentry-panic` catches a panic with a hook
# and only manages to send the event while the stack unwinds, and (2) remove the
# worker isolation of actix: a panic in one request would take the whole process
# down instead of a single connection. The savings are not comparable.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
