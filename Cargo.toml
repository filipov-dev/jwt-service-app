[package]
name = "jwt-service-app"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.9"
actix-cors = "0.7"
#jsonwebtoken = { version = "9.3", features = ["serde_macros"] }
jsonwebtoken = { version = "9.3", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12.12", features = ["json"] }
redis = { version = "0.29.0", features = ["tokio-comp"] }
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
utoipa = { version = "5.3.1", features = ["actix_extras", "chrono"] }
thiserror = "2.0.11"
futures = "0.3"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "ansi"] }
tracing-actix-web = "0.7"
colored = "2.1"
openssl = "0.10.70"
base64 = "0.22.1"