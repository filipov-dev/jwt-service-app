# The gitleaks configuration for a scan over the whole repository history.
#
# It is run by scripts/scan-secrets.sh (the same script runs in
# .github/workflows/secrets.yml). The report of the last audit and the analysis
# of the findings are in docs/security/secret-audit.md.
#
# The rules are the standard ones, taken in full: the purpose of this config is
# not to weaken detection but to silence exactly the lines already proven not to
# be secrets. Every allowlist entry is separate and carries a reason: the list
# must read as a list of decisions rather than as "to make CI green".

title = "jwt-service-app secret scan"

[extend]
useDefault = true

# Silencing is done by VALUE (regexTarget = "secret"), never by file path.
# The difference is fundamental: an allowlist on `deployments/dev/**` would also
# blind the scanner to a real secret accidentally committed into the same file —
# and that slip is most likely in the dev stand of all places. Binding to the
# value silences the specific known strings and leaves the files under watch.
[[allowlists]]
description = """
Demo secrets of the local dev stand and of the load run.

AUTH_TOTP_SECRET from deployments/dev/docker-compose.yml,
deployments/load/run.sh, deployments/load/README.md and the unit tests in
src/main.rs. It is valid base32 (or the service would not start), so it has high
entropy and generic-api-key catches it as a key. It decodes to nonsense — a
generated string tied to no environment at all.

The production values of these variables are not in the repository at all:
deployments/prod/.env and k8s/secret.yaml are in .gitignore, and only
.env.example is committed.
"""
regexTarget = "secret"
regexes = [
    '''MRSWGYLSMUQGO33WNFXGO4ZAOBWGKYLSFVRW63LOMNXW2ZI''',
    '''dev-proxy-secret''',
    '''dev-metrics-token''',
]
