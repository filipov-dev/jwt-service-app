# One toolchain for local development and CI. Without this file the local clippy
# could be any version: the `manual_option_zip` fix in JWT-31 passed on 1.94 and
# failed in the pipeline on 1.97 — the lint appeared between those versions.
#
# `stable` (rather than a pinned version) because CI installs exactly the latest
# stable (`dtolnay/rust-toolchain@stable`), and a pin here would mean a
# divergence from the pipeline in the opposite direction.
#
# IMPORTANT: the file guarantees the channel and the components but does NOT
# update an already installed stable — rustup silently takes the local copy even
# if it is six months old. Before running the linter: `rustup update stable`.
#
# Docker builds deliberately bypass this file through `RUSTUP_TOOLCHAIN` (prod)
# or a stable installed in advance in the image (dev) — see
# `deployments/*/Dockerfile`.
[toolchain]
channel = "stable"
components = ["clippy", "rustfmt"]
