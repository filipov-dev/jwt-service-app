# Единый тулчейн для локальной разработки и CI. Без этого файла локальный clippy
# мог быть любой версии: правка `manual_option_zip` в JWT-31 прошла на 1.94 и
# упала в пайплайне на 1.97 — линт появился между версиями.
#
# `stable` (а не фиксированная версия) — потому что CI ставит именно свежий
# stable (`dtolnay/rust-toolchain@stable`), и пин здесь означал бы расхождение с
# пайплайном ровно в обратную сторону.
#
# ВАЖНО: файл гарантирует канал и компоненты, но НЕ обновляет уже установленный
# stable — rustup молча возьмёт локальную копию, даже если она полугодовой
# давности. Перед прогоном линта: `rustup update stable`.
#
# Docker-сборки этот файл намеренно обходят через `RUSTUP_TOOLCHAIN` (prod) или
# заранее установленный stable в образе (dev) — см. `deployments/*/Dockerfile`.
[toolchain]
channel = "stable"
components = ["clippy", "rustfmt"]
