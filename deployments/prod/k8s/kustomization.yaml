# Applying it: kubectl apply -k deployments/prod/k8s/
#
# secret.example.yaml is deliberately NOT listed here: it is a sample, not a
# manifest to apply. Create the Secret through the cluster's secret manager, or
# copy the sample to secret.yaml, fill it in and add it to resources locally.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - pdb.yaml
  - networkpolicy.yaml

# `labels` (without includeSelectors) rather than `commonLabels`: the latter also
# writes the labels into the Deployment's selector, and a selector is immutable
# after creation — such a manifest would apply once and fail on the next update
# with a field error
# spec.selector.
labels:
  - pairs:
      app.kubernetes.io/part-of: jwt-platform
