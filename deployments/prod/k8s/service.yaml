apiVersion: v1
kind: Service
metadata:
  name: jwt-service-app
  labels:
    app.kubernetes.io/name: jwt-service-app
spec:
  # ClusterIP rather than LoadBalancer/NodePort: the service faces outwards only
  # through the ingress, which injects X-Proxy-Secret. Publishing the Service
  # directly gives access past the proxy, that is, past level 2.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: jwt-service-app
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
