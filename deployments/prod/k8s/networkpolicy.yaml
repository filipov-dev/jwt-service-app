# NetworkPolicy: кто вправе стучаться в поды сервиса.
#
# Это то же правило, что README формулирует словами, но закреплённое в
# кластере: порт наружу не публикуется, трафик приходит только через обратный
# прокси. Уровень 2 (`X-Proxy-Secret`) держится на том, что заголовок ставит
# прокси — любой под кластера, сходивший в ClusterIP напрямую, этот уровень
# обходит. `type: ClusterIP` закрывает сервис только снаружи кластера, внутри
# он доступен всем подам всех namespace'ов; вот этот зазор политика и убирает.
#
# ВНИМАНИЕ: NetworkPolicy исполняет CNI. Плагины без её поддержки (например,
# голый flannel) принимают манифест молча и не делают ничего — защита окажется
# только на бумаге. Проверьте, что ваш CNI её реализует (Calico, Cilium,
# Antrea, Weave, сетевые плагины managed-кластеров), и убедитесь после
# применения, что под из постороннего namespace до порта 8080 не достаёт.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jwt-service-app
  labels:
    app.kubernetes.io/name: jwt-service-app
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: jwt-service-app

  # Отдельный манифест «default-deny» не нужен: как только политика выбрала
  # под, для перечисленных policyTypes он переходит в режим «запрещено всё, что
  # не разрешено явно». Правила ниже — исчерпывающий список источников.
  #
  # Egress не ограничиваем намеренно. Сервис ходит в Redis, сервис ключей, а по
  # желанию ещё в OTLP-коллектор и GlitchTip; адреса двух последних зависят от
  # стенда, и политика с забытым исключением ломает не сеть, а телеметрию —
  # молча. Ограничение исходящего трафика — это отдельное решение под конкретный
  # кластер, а не то, что стоит зашивать в публичный образец.
  policyTypes:
    - Ingress

  ingress:
    - from:
        # 1. Ingress-контроллер — единственный штатный источник трафика.
        #    Метка `kubernetes.io/metadata.name` проставляется API-сервером
        #    каждому namespace автоматически (с Kubernetes 1.21), поэтому
        #    размечать namespace вручную не нужно. Имена namespace и подов
        #    контроллера уточняются под кластер:
        #      kubectl get pods -A -l app.kubernetes.io/name=ingress-nginx
        #    Тот же адрес должен быть в RATE_LIMIT_TRUSTED_PROXIES: обе
        #    настройки описывают одного и того же соседа.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx

        # 2. Скрейпер метрик. `/metrics` живёт на том же порту, что и рабочие
        #    ручки, и на уровне сети от них не отличается — поэтому источник
        #    выделен отдельным правилом, а сама ручка закрыта уровнем 4
        #    (Bearer-токен). Нет namespace `monitoring` — правило просто ни во
        #    что не попадает, удалять его не обязательно.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring

      # Именованный порт, а не 8080: имя берётся из `ports` контейнера, так
      # политика не разъедется с Deployment'ом при смене номера порта.
      ports:
        - port: http
          protocol: TCP

  # Пробы kubelet приходят с адреса узла, а не из пода, и под правила выше не
  # попадают. Большинство CNI пропускают их отдельно (host-трафик у Calico и
  # Cilium разрешён по умолчанию), но если после применения политики поды
  # начали падать по liveness — добавьте сюда правило с ipBlock на подсеть
  # узлов кластера.
