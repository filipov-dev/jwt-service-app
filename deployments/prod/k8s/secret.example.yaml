# A sample Secret. The file with the real values (`secret.yaml`) is not
# committed — see .gitignore.
#
# This is a starting point for a cluster without a secret manager. With an
# External Secrets Operator, a Vault Agent Injector or Sealed Secrets, create the
# Secret through those and take only the list of keys from this file: the
# Deployment expects a Secret named `jwt-service-app` with the keys below.
#
# stringData rather than data: the values go in as they are and the API server
# does the base64 encoding. Base64 is NOT encryption; a Secret sits in etcd in
# the clear unless encryption at rest is enabled for the cluster.
apiVersion: v1
kind: Secret
metadata:
  name: jwt-service-app
  labels:
    app.kubernetes.io/name: jwt-service-app
type: Opaque
stringData:
  # Level 2. The same secret is configured on the ingress controller, which sets
  # the X-Proxy-Secret header and must strip the client-supplied version of it.
  AUTH_PROXY_SECRET: "replace me"

  # Level 3. Base32 without padding, the same secret as on the clients.
  AUTH_TOTP_SECRET: "replace me"

  # A second active secret for the duration of a rotation. The key is marked
  # optional in the Deployment: while no rotation is in progress it need not
  # exist at all.
  AUTH_TOTP_SECRET_NEXT: ""

  # Level 4. The bearer token for scraping /metrics. Empty or missing means the
  # endpoint is not published (404) while the service starts normally.
  AUTH_METRICS_TOKEN: ""

  # The GlitchTip DSN. Empty means the integration is off.
  GLITCHTIP_DSN: ""
