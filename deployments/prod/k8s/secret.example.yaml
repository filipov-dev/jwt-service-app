# Образец Secret'а. Файл с настоящими значениями (`secret.yaml`) в репозиторий
# не коммитится — см. .gitignore.
#
# Это заготовка на случай, когда секрет-менеджера в кластере нет. Если есть
# External Secrets Operator, Vault Agent Injector или Sealed Secrets — заводите
# Secret через них, а из этого файла берите только список ключей: Deployment
# ждёт Secret с именем `jwt-service-app` и ключами ниже.
#
# stringData вместо data: значения кладутся как есть, base64 кодирует API-сервер.
# Base64 — это НЕ шифрование; Secret в etcd лежит открытым, если не включено
# шифрование данных на уровне кластера.
apiVersion: v1
kind: Secret
metadata:
  name: jwt-service-app
  labels:
    app.kubernetes.io/name: jwt-service-app
type: Opaque
stringData:
  # Уровень 2. Тот же секрет прописывается ingress-контроллеру, который ставит
  # заголовок X-Proxy-Secret и обязан затирать клиентскую версию заголовка.
  AUTH_PROXY_SECRET: "замените"

  # Уровень 3. Base32 без паддинга, тот же секрет у клиентов.
  AUTH_TOTP_SECRET: "замените"

  # Второй активный секрет на время ротации. Ключ помечен optional в Deployment:
  # пока ротации нет, его можно не заводить вовсе.
  AUTH_TOTP_SECRET_NEXT: ""

  # Уровень 4. Bearer-токен для скрейпа /metrics. Пусто или ключ отсутствует —
  # ручка не публикуется (404), сервис стартует нормально.
  AUTH_METRICS_TOKEN: ""

  # DSN GlitchTip. Пусто — интеграция выключена.
  GLITCHTIP_DSN: ""
