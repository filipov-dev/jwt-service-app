# PodDisruptionBudget: сколько подов разрешено отпустить ДОБРОВОЛЬНЫМ
# выселениям — drain узла перед обновлением, дескейл пула, работы на железе.
# Отказ узла, OOM-kill и падение самого процесса PDB не покрывает: это
# договорённость с оператором кластера о планируемых операциях, а не защита
# от аварий.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: jwt-service-app
  labels:
    app.kubernetes.io/name: jwt-service-app
spec:
  # minAvailable, а не maxUnavailable: при replicas: 3 это «в балансировке
  # всегда минимум два пода». Drain отпускает поды по одному и ждёт, пока
  # замена поднимется, вместо того чтобы выселить все три разом вместе с узлом.
  #
  # Абсолютное число, а не проценты: 50% от трёх — те же 2, но при смене числа
  # реплик такое значение молча уедет.
  #
  # ВАЖНО: значение связано с `replicas` в deployment.yaml. Уменьшите реплики
  # до двух, не тронув PDB, — и любой drain встанет намертво: бюджет и так на
  # грани, отпускать нечего. Меняете replicas — пересчитайте minAvailable.
  minAvailable: 2

  # Что делать с подами, которые не в Ready. По умолчанию (IfHealthyBudget) их
  # разрешено выселять, только когда бюджет и без того выполнен. У этого
  # сервиса readiness завязана на Redis и сервис ключей: при их недоступности
  # из балансировки уходят разом все поды, бюджет не выполняется — и drain
  # оказывается заблокирован ровно тогда, когда узел и надо освободить.
  # AlwaysAllow разрешает выселять уже неработающие поды: сервису от этого
  # хуже не станет, он в таком состоянии всё равно не обслуживает.
  #
  # Поле стабильно с Kubernetes 1.27; на более старом кластере просто удалите
  # его — остальное продолжит работать.
  unhealthyPodEvictionPolicy: AlwaysAllow

  # Селектор тот же, что у Deployment'а. Отдельного `part-of` здесь нет
  # намеренно: kustomize дописывает общие метки в metadata, но не в селекторы
  # (см. комментарий в kustomization.yaml), и PDB должен ловить поды по той же
  # паре меток, по которой их создаёт Deployment.
  selector:
    matchLabels:
      app.kubernetes.io/name: jwt-service-app
