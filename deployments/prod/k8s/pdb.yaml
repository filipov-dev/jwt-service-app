# PodDisruptionBudget: how many pods VOLUNTARY evictions may take — a node drain
# before an upgrade, a pool scale-down, hardware work. A node failure, an OOM
# kill and a crash of the process itself are not covered by a PDB: it is an
# agreement with the cluster operator about planned operations, not protection
# against outages.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: jwt-service-app
  labels:
    app.kubernetes.io/name: jwt-service-app
spec:
  # minAvailable rather than maxUnavailable: with replicas: 3 it means "at least
  # two pods are always in the load balancer". A drain releases the pods one at a
  # time and waits for a replacement to come up instead of evicting all three at
  # once together with the node.
  #
  # An absolute number rather than a percentage: 50% of three is the same 2, but
  # such a value drifts silently when the replica count changes.
  #
  # IMPORTANT: the value is tied to `replicas` in deployment.yaml. Reduce the
  # replicas to two without touching the PDB and any drain blocks outright: the
  # budget is already at its edge and there is nothing to release. Change
  # replicas and recompute minAvailable.
  minAvailable: 2

  # What to do with pods that are not Ready. By default (IfHealthyBudget) they
  # may be evicted only when the budget is met anyway. The readiness of this
  # service depends on Redis and the key service: when those are unavailable
  # every pod leaves the load balancer at once, the budget is not met — and a
  # drain is blocked at exactly the moment the node needs to be freed.
  # AlwaysAllow permits evicting pods that are already not working: it makes
  # nothing worse for the service, which is not serving in that state anyway.
  #
  # The field is stable since Kubernetes 1.27; on an older cluster simply delete
  # it — the rest keeps working.
  unhealthyPodEvictionPolicy: AlwaysAllow

  # The same selector as the Deployment's. A separate `part-of` is deliberately
  # absent here: kustomize writes the common labels into metadata but not into
  # selectors (see the comment in kustomization.yaml), and the PDB must match
  # pods by the same pair of labels the Deployment creates them with.
  selector:
    matchLabels:
      app.kubernetes.io/name: jwt-service-app
