apiVersion: apps/v1
kind: Deployment
metadata:
  name: jwt-service-app
  labels:
    app.kubernetes.io/name: jwt-service-app
spec:
  # Three replicas: the service holds no local state (the jti values and refresh
  # tokens live in Redis), so it scales horizontally without caveats.
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: jwt-service-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jwt-service-app
    spec:
      # Spreading the replicas across the cluster. Without it the scheduler may
      # place all three pods on one node: replicas: 3 then insures only against a
      # process crash, while a drain or a node failure takes verify down
      # entirely. In such a layout the PDB (pdb.yaml) is useless too — releasing
      # pods one at a time is impossible, they are evicted together with the
      # node.
      topologySpreadConstraints:
        # Across nodes it is strict. A skew larger than one pod is not allowed,
        # so three replicas need at least three nodes ready to take them.
        #
        # IMPORTANT: on a cluster of fewer than three nodes the extra replicas
        # stay Pending forever, and a drain stalls along with them (the PDB never
        # reaches minAvailable: 2). Fewer than three nodes means switching to
        # ScheduleAnyway.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: jwt-service-app
          # The skew is computed per Deployment revision. Without this, during an
          # update the new pod counts together with the old ones: on three nodes
          # with three old pods the surge pod violates maxSkew and hangs Pending,
          # while the default maxUnavailable for three replicas is zero — an old
          # pod is not removed until a new one is up. The rollout stalls
          # completely.
          #
          # The field is available since Kubernetes 1.27. On 1.25/1.26 delete it
          # and set spec.strategy.rollingUpdate.maxUnavailable: 1.
          matchLabelKeys:
            - pod-template-hash

        # Across zones it is soft: a single-zone cluster (and any with fewer
        # than three zones) is normal, and a hard requirement would leave pods
        # Pending for no reason. ScheduleAnyway turns the rule into a preference:
        # with zones it spreads across them, without them it just spreads across
        # nodes.
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: jwt-service-app
          matchLabelKeys:
            - pod-template-hash

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: app
          # The tag is pinned to a version rather than latest: with latest a
          # rollback amounts to "we hope the registry still remembers the previous
          # image".
          image: filipov/jwt-service-app:1.13.4
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          env:
            # 0.0.0.0 is required: the default 127.0.0.1 listens only on the
            # loopback inside the container, and the kubelet cannot even reach a
            # probe.
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8080"

            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: JWKS_SERVICE_URL
              value: "http://jwks-service-app:8080"

            # The number of worker threads is set EXPLICITLY. The actix default
            # follows the host core count, and the CPU limit is deliberately
            # absent here (see resources below), so this pod has no quota for the
            # service to derive the worker count from: on a 64-core node it would
            # start 64 workers, all sharing the memory limit. The value is aligned
            # with requests.cpu: two workers means two concurrent
            # signings/verifications per pod, six per service across three
            # replicas.
            - name: SERVER_WORKERS
              value: "2"

            # Draining connections on shutdown. It is tied to
            # terminationGracePeriodSeconds below and must be strictly smaller:
            # the actix default (30 s) would coincide with the grace period and
            # SIGKILL would arrive exactly as the drain runs out — leaving time
            # neither to finish the last request nor to flush telemetry. Change
            # one and recompute the other.
            - name: SERVER_SHUTDOWN_TIMEOUT_SECONDS
              value: "25"

            # The domains acceptable in the `iss` claim (the value of the Host
            # header). Empty or unset means any Host, as before. Cluster-specific:
            # these are the same names as in the ingress. Mandatory when this and
            # neighbouring services talk to the same jwks-service-app: the shared
            # key makes a token with someone else's `iss` valid at the
            # neighbour.
            - name: TOKEN_ISSUER_ALLOWLIST
              value: "jwt.example.com"

            - name: LOG_FORMAT
              value: "json"
            - name: RUST_LOG
              value: "jwt_service_app=info"

            - name: AUTH_TOTP_REPLAY_PROTECTION
              value: "true"

            # The addresses whose X-Forwarded-For we trust. Here it is the pod
            # network of the ingress controller, NOT the client network: the
            # request reaches the service from an ingress controller pod.
            # Cluster-specific:
            #   kubectl -n ingress-nginx get pods -o wide
            # It must not be left empty — the per-IP limit would then be keyed by
            # the ingress pod address and every client would share one limit.
            - name: RATE_LIMIT_TRUSTED_PROXIES
              value: "10.244.0.0/16"

            # The secrets come from a Secret rather than from value. We do not
            # take the whole thing through envFrom: this way the manifest shows
            # exactly which variables arrive from outside.
            - name: AUTH_PROXY_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-service-app
                  key: AUTH_PROXY_SECRET
            - name: AUTH_TOTP_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-service-app
                  key: AUTH_TOTP_SECRET
            - name: AUTH_TOTP_SECRET_NEXT
              valueFrom:
                secretKeyRef:
                  name: jwt-service-app
                  key: AUTH_TOTP_SECRET_NEXT
                  optional: true
            - name: AUTH_METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: jwt-service-app
                  key: AUTH_METRICS_TOKEN
                  optional: true
            - name: GLITCHTIP_DSN
              valueFrom:
                secretKeyRef:
                  name: jwt-service-app
                  key: GLITCHTIP_DSN
                  optional: true

          # /livez answers as long as the HTTP layer is alive and does NOT touch
          # the dependencies. That is exactly why it is here: liveness on /readyz
          # would restart pods whenever Redis was unavailable — that is, during a
          # dependency outage we would also be taking the service down with
          # restarts.
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # /readyz checks Redis and the key service: while they are unavailable
          # the pod leaves the load balancer but is not restarted. An unavailable
          # jwks-service-app does not count as a failure while a usable JWKS
          # snapshot is in memory: verification is served from it and there is no
          # reason to kill the pod (otherwise the stale cache would not help in
          # exactly the outage it was built for).
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2

          # A separate startup probe allows time for the first warm-up without
          # weakening liveness: until it succeeds, liveness does not count.
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 2
            failureThreshold: 15

          resources:
            requests:
              cpu: 100m
              # A pod with two workers: the runtime and static data ~30Mi, the
              # worker stacks 2Mi each (8Mi virtual, less resident), the JWKS
              # cache and the per-IP limit table a few Mi. 64Mi covers the steady
              # state.
              memory: 64Mi
            limits:
              # The CPU is deliberately not limited: throttling hurts the latency
              # tails of the cryptography (signing and verification), while
              # requests already guarantee a share. A memory limit is in place — a
              # leak must not take the node down.
              #
              # 256Mi is about 4x the steady-state consumption at
              # SERVER_WORKERS=2. The headroom covers a burst of the per-IP limit
              # table (swept every 5 minutes) and peak crypto allocations, but it
              # no longer has to cover an unknown number of workers: before JWT-37
              # there were as many as the node had cores, and the limit bore no
              # relation to them. Change SERVER_WORKERS and recompute the limit
              # too.
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

      # Recreating a pod must not tear in-flight requests: the pod first leaves
      # the endpoints and only then receives SIGTERM. The headroom over
      # SERVER_SHUTDOWN_TIMEOUT_SECONDS (25 s) is the time to flush telemetry
      # after the server stops; change it here and change the variable too.
      terminationGracePeriodSeconds: 30
