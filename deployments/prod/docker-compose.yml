# The production stand: the service plus Redis behind a reverse proxy.
#
# The differences from the dev stand (`deployments/dev/docker-compose.yml`),
# beyond the obvious absence of Swagger UI and Redis Commander:
#   * the image comes from a registry rather than being built locally;
#   * the secrets come from `.env` (see `.env.example`) rather than sitting in
#     open source;
#   * the service port is NOT published to the host — only the proxy faces
#     outwards;
#   * the subnet is set explicitly so that `RATE_LIMIT_TRUSTED_PROXIES` is
#     deterministic.
#
# Running it (the project name is mandatory — many services have a `prod`
# directory):
#   docker compose -p jwt-prod --env-file .env up -d

name: jwt-prod

services:
  app:
    image: filipov/jwt-service-app:${JWT_SERVICE_VERSION:-latest}
    restart: unless-stopped
    # The port is not published: levels 2 and 3 rest on headers set by the proxy,
    # and direct access to the container bypasses them.
    expose:
      - "8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080

      REDIS_URL: redis://redis:6379
      JWKS_SERVICE_URL: ${JWKS_SERVICE_URL}

      TOKEN_ALGORITHM: ${TOKEN_ALGORITHM:-RS256}
      TOKEN_EXPIRATION_SECONDS: ${TOKEN_EXPIRATION_SECONDS:-3600}

      # The domains acceptable in the `iss` claim (the value of the Host header),
      # comma-separated. Empty means any Host, as before. Set it explicitly: with
      # a jwks-service-app shared with a neighbouring instance, a token with
      # someone else's `iss` signed by the shared key is issued here and the
      # neighbour accepts it as its own.
      TOKEN_ISSUER_ALLOWLIST: ${TOKEN_ISSUER_ALLOWLIST:-}

      # The workers and the connection timeouts. Empty means the service works
      # the worker count out itself: from the container's CPU quota, and without
      # one (`cpus` is not set here) from the default ceiling rather than the host
      # core count. Set `cpus` in deploy.resources and the number adapts to the
      # quota automatically.
      SERVER_WORKERS: ${SERVER_WORKERS:-}
      SERVER_CLIENT_REQUEST_TIMEOUT_MS: ${SERVER_CLIENT_REQUEST_TIMEOUT_MS:-5000}
      SERVER_KEEP_ALIVE_SECONDS: ${SERVER_KEEP_ALIVE_SECONDS:-5}

      # The time allowed to finish requests on shutdown. Aligned with
      # stop_grace_period below: the docker default is 10 s, so without it the
      # container would get SIGKILL mid-drain.
      SERVER_SHUTDOWN_TIMEOUT_SECONDS: ${SERVER_SHUTDOWN_TIMEOUT_SECONDS:-25}

      # The secrets come only from .env, which is not committed.
      AUTH_PROXY_SECRET: ${AUTH_PROXY_SECRET:?AUTH_PROXY_SECRET is required}
      AUTH_TOTP_SECRET: ${AUTH_TOTP_SECRET:?AUTH_TOTP_SECRET is required}
      AUTH_TOTP_SECRET_NEXT: ${AUTH_TOTP_SECRET_NEXT:-}
      AUTH_METRICS_TOKEN: ${AUTH_METRICS_TOKEN:-}

      # TOTP replay protection: enabled in production, Redis is right here.
      AUTH_TOTP_REPLAY_PROTECTION: "true"

      # The per-IP limit key is taken from X-Forwarded-For only when the request
      # came from a trusted address. Behind a proxy without this list every client
      # looks like one address (the proxy's) and they all share a single limit.
      RATE_LIMIT_TRUSTED_PROXIES: ${RATE_LIMIT_TRUSTED_PROXIES:-172.31.0.0/16}

      LOG_FORMAT: ${LOG_FORMAT:-json}
      RUST_LOG: ${RUST_LOG:-jwt_service_app=info}

      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
      GLITCHTIP_ENVIRONMENT: ${GLITCHTIP_ENVIRONMENT:-prod}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      redis:
        condition: service_healthy
    # The docker default is 10 s, less than the drain
    # (SERVER_SHUTDOWN_TIMEOUT_SECONDS=25): the container would get SIGKILL with
    # requests in flight. The equivalent of terminationGracePeriodSeconds in the
    # k8s manifest, with the same headroom over the drain — for flushing telemetry
    # after the server stops.
    stop_grace_period: 30s
    healthcheck:
      # The runtime image has neither curl nor wget — only bash. So the request
      # goes through /dev/tcp: a redirection built into bash that needs no
      # external tools. Reaching for `nc`/`curl` is pointless — they are not
      # there.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET /livez HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; grep -q "200 OK" <&3'
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF: Redis holds the issued jti values and refresh tokens. Without
    # persistence a Redis restart "un-revokes" every revoked token and kills the
    # live sessions.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis_data:

networks:
  default:
    ipam:
      config:
        # The subnet is pinned so that RATE_LIMIT_TRUSTED_PROXIES does not have
        # to be edited after every recreation of the network: a proxy address from
        # this subnet is predictable. Change the subnet and change the list of
        # trusted proxies too.
        - subnet: 172.31.0.0/16
