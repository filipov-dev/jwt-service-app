# An isolated dependency stand for the load test (JWT-34).
#
# WHY A SEPARATE FILE rather than `deployments/dev`:
#
# 1. The project name. By default Compose takes the project name from the
#    directory name, and a `dev` directory exists in many services at once — the
#    containers of different stands end up in one `dev` project and hijack each
#    other (compose treats someone else's container as its own service and
#    recreates it). Here the project name is pinned by the `name:` directive and
#    does not depend on the directory.
# 2. The ports. The dev stand publishes 6379/5432/8082 — usually already taken by
#    other local stands. Here the ports are shifted and have nothing to clash
#    with.
# 3. The contents. A measurement needs only the dependencies: the service itself
#    is started from the host as a release build (the dev container is built for
#    hot reload and is unfit for measurements — the debug profile distorts the
#    numbers several times over).
name: jwt-load

services:
  redis:
    image: redis:alpine
    ports:
      - "16379:6379"

  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: jwk_db
    ports:
      - "15432:5432"
    # The data deliberately has no volume: the stand is disposable and is meant
    # to be brought up from scratch between runs.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d jwk_db"]
      interval: 2s
      timeout: 3s
      retries: 15

  jwks-service-app:
    image: filipov/jwks-service-app:latest
    environment:
      HOST: 0.0.0.0
      PORT: 8082
      DATABASE_URL: postgres://user:password@postgres:5432/jwk_db
      RUN_MIGRATIONS_ON_START: 1
      PRIVATE_KEY_EXPIRATION_SECONDS: 86400
      KEY_EXPIRATION_SECONDS: 172800
    ports:
      - "18082:8082"
    # `service_healthy` specifically, not a plain `depends_on`: the key service
    # applies migrations at startup and panics if Postgres is not accepting
    # connections yet. An ordinary `depends_on` only waits for the container to
    # start.
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
